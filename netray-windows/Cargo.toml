[package]
name = "netray-windows"
version = "0.1.0"
edition = "2021"

[lib]
name = "netray_windows"
path = "src/lib.rs"

[[bin]]
name = "netray-windows"
path = "src/main.rs"

[dependencies]

iced = { version = "0.13", default-features = false, features = ["tokio", "advanced", "svg", "tiny-skia", "wgpu"] }
tokio = { version = "1", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
tokio-rustls = "0.26"
rustls-pki-types = "1.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
base64 = "0.22"
percent-encoding = "2.3"
png = "0.18"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
