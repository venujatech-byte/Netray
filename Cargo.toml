[package]
name = "netray"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "advanced"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
futures = "0.3"

# Networking: SSH, TLS/SNI & Async Traits
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
tokio-rustls = "0.26"
rustls-pki-types = "1.8"