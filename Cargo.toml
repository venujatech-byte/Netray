[package]
name = "netray"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tokio", "advanced", "svg", "wgpu"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
futures = "0.3"
url = "2.5"
base64 = "0.22"
percent-encoding = "2.3"
png = "0.18"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

# Networking: SSH, TLS/SNI & Async Traits
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
tokio-rustls = "0.26"
rustls-pki-types = "1.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
