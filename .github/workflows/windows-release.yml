name: Netray Windows CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Build Netray Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            netray-windows/target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('netray-windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Run Windows Tests
        run: cargo test --manifest-path netray-windows/Cargo.toml --verbose

      - name: Build Release Binary
        run: cargo build --manifest-path netray-windows/Cargo.toml --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netray-windows-x86_64
          path: netray-windows/target/release/netray-windows.exe
