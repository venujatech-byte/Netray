name: Netray Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build ${{ matrix.os }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Calculate release version
        shell: bash
        run: |
          OFFSET=66
          BUILD_NUM=$(( ${{ github.run_number }} - OFFSET ))
          if [ "$BUILD_NUM" -lt 0 ]; then
            BUILD_NUM=0
          fi
          echo "NETRAY_VERSION=2.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION=2.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip rpm zstd pkg-config libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libvulkan-dev

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            netray-windows/target
          key: ${{ runner.os }}-${{ matrix.os }}-x86-64-baseline-cargo-${{ hashFiles('Cargo.lock', 'netray-windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-x86-64-baseline-cargo-

      - name: Set Linux x86-64 baseline
        if: runner.os == 'Linux'
        run: echo 'CFLAGS=-march=x86-64 -mtune=generic' >> "$GITHUB_ENV"

      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test-supervisor.py
          cargo test --locked

      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path netray-windows/Cargo.toml --verbose

      - name: Setup Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. Setup WiX Toolset for MSI Installer
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            if (Test-Path "$wixPath\candle.exe") {
              echo $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset -y --no-progress
              echo $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          # 2. Add Windows SDK tools to PATH for MakeAppx and SignTool
          if (-not (Get-Command makeappx.exe -ErrorAction SilentlyContinue)) {
            $sdkBin = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\x64\*" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1)
            if ($sdkBin) {
              $sdkDir = Split-Path $sdkBin.FullName -Parent
              echo $sdkDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME || secrets.MS_STORE_IDENTITY_NAME || '' }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER || secrets.MS_STORE_PUBLISHER || '' }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME || secrets.MS_STORE_PUBLISHER_DISPLAY_NAME || 'VTechDev' }}
        run: |
          cargo build --manifest-path netray-windows/Cargo.toml --release
          ./netray-windows/scripts/package-windows.ps1 -Version $env:NETRAY_VERSION

      - name: Build Linux RPM and portable package
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh "$NETRAY_VERSION"

      - name: Verify Linux distro packages
        if: runner.os == 'Linux'
        run: bash scripts/verify-linux-packages.sh

      - name: Test packaged Linux core
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/netray-core-test"
          tar -xzf "dist/netray-linux-linux-64-$NETRAY_VERSION.tar.gz" -C "$RUNNER_TEMP/netray-core-test"
          export PATH="$RUNNER_TEMP/netray-core-test:$PATH"
          export NETRAY_TEST_XRAY="$RUNNER_TEMP/netray-core-test/xray"
          cargo test --locked -- --ignored

      - name: Test packaged Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NETRAY_TEST_XRAY = (Resolve-Path "netray-windows/dist/netray-windows/xray.exe").Path
          cargo test --locked --manifest-path netray-windows/Cargo.toml -- --ignored

      - name: Upload Windows release package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: netray-windows
          path: |
            netray-windows/dist/*.zip
            netray-windows/dist/*.msi
            netray-windows/dist/*.msix
            netray-windows/dist/*.cer

      - name: Upload Linux release packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: netray-linux
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: netray-*
          path: dist
          merge-multiple: true

      - name: Calculate release version
        shell: bash
        run: |
          OFFSET=66
          BUILD_NUM=$(( ${{ github.run_number }} - OFFSET ))
          if [ "$BUILD_NUM" -lt 0 ]; then
            BUILD_NUM=0
          fi
          echo "NETRAY_VERSION=2.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION=2.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --pretty=format:"* %s (%h)")
          fi

          cat << EOF > dist/RELEASE_NOTES.md
          ## Netray v$VERSION

          ### 🚀 Changes in this Build
          ${COMMITS:-* Automated CI build and release package}

          ### 📦 Built Packages
          - **Windows 64-bit MSI Installer**: \`netray-windows-$VERSION.msi\` (official Windows Installer with wizard)
          - **Microsoft Store / MSIX Package**: \`netray-windows-$VERSION.msix\` (MSIX package for Store and modern Windows)
          - **Windows Sideload Certificate**: \`netray-windows-$VERSION.cer\` (for local MSIX testing/sideloading)
          - **Windows 64-bit Portable**: \`netray-windows-$VERSION.zip\` (bundled with Wintun driver & Xray-core)
          - **Linux RPM Package**: \`netray-$VERSION-1.x86_64.rpm\` (Fedora, RHEL, openSUSE)
          - **Debian / Ubuntu Package**: \`netray-$VERSION-1.amd64.deb\`
          - **Arch Linux Package**: \`netray-$VERSION-1-x86_64.pkg.tar.zst\`
          - **Linux 64-bit Portable**: \`netray-linux-linux-64-$VERSION.tar.gz\` (bundled with Xray-core)

          ### 🔒 Integrity & Security
          - Bundled with Netray-patched Xray-core 1b1647cd9ddf; modified source included.
          - Built on GitHub CI from commit \`${GITHUB_SHA}\`.
          EOF

      - name: Generate update manifest latest.json
        run: |
          python3 -c "
          import json, os, hashlib, datetime

          version = os.environ.get('VERSION', '2.0.0')
          repo = os.environ.get('GITHUB_REPOSITORY', 'venujatech-byte/Netray')
          tag = f'v{version}'
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()

          platforms = {}

          # Windows MSI Installer
          msi_file = None
          for f in sorted(os.listdir('dist')):
              if f.endswith('.msi') and f.startswith('netray-windows-'):
                  msi_file = os.path.join('dist', f)
                  break

          if msi_file and os.path.exists(msi_file):
              with open(msi_file, 'rb') as fp:
                  data = fp.read()
                  h = hashlib.sha256(data).hexdigest()
                  sz = len(data)
                  fname = os.path.basename(msi_file)
                  platforms['windows-x64-msi'] = {
                      'url': f'https://github.com/{repo}/releases/download/{tag}/{fname}',
                      'sha256': h,
                      'size': sz
                  }

          # Windows Setup EXE (if present)
          exe_file = None
          for f in sorted(os.listdir('dist')):
              if f.endswith('.exe') and 'setup' in f.lower():
                  exe_file = os.path.join('dist', f)
                  break

          if exe_file and os.path.exists(exe_file):
              with open(exe_file, 'rb') as fp:
                  data = fp.read()
                  h = hashlib.sha256(data).hexdigest()
                  sz = len(data)
                  fname = os.path.basename(exe_file)
                  platforms['windows-x64-exe'] = {
                      'url': f'https://github.com/{repo}/releases/download/{tag}/{fname}',
                      'sha256': h,
                      'size': sz
                  }

          manifest = {
              'version': version,
              'release_date': now,
              'notes': f'Netray {tag} official release',
              'platforms': platforms
          }

          with open('dist/latest.json', 'w') as out:
              json.dump(manifest, out, indent=2)
          print('Successfully generated dist/latest.json:')
          print(json.dumps(manifest, indent=2))
          "

      - name: Create or update versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          files=()
          for f in dist/*.zip dist/*.msi dist/*.msix dist/*.cer dist/*.rpm dist/*.deb dist/*.pkg.tar.zst dist/*.tar.gz dist/latest.json; do
            [ -f "$f" ] && files+=("$f")
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" -F dist/RELEASE_NOTES.md --title "Netray $tag"
          else
            gh release create "$tag" "${files[@]}" --target "${GITHUB_SHA}" \
              --title "Netray $tag" \
              -F dist/RELEASE_NOTES.md
          fi
