name: Netray Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build ${{ matrix.os }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Calculate release version
        shell: bash
        run: |
          OFFSET=29
          BUILD_NUM=$(( ${{ github.run_number }} - OFFSET ))
          if [ "$BUILD_NUM" -lt 4 ]; then
            BUILD_NUM=4
          fi
          echo "NETRAY_VERSION=1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION=1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip rpm pkg-config libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libvulkan-dev

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            netray-windows/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'netray-windows/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: cargo test --locked

      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path netray-windows/Cargo.toml --verbose

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path netray-windows/Cargo.toml --release
          ./netray-windows/scripts/package-windows.ps1 -Version $env:NETRAY_VERSION

      - name: Build Linux RPM and portable package
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh "$NETRAY_VERSION"

      - name: Test packaged Linux core
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/netray-core-test"
          tar -xzf "dist/netray-linux-linux-64-$NETRAY_VERSION.tar.gz" -C "$RUNNER_TEMP/netray-core-test"
          export PATH="$RUNNER_TEMP/netray-core-test:$PATH"
          export NETRAY_TEST_XRAY="$RUNNER_TEMP/netray-core-test/xray"
          cargo test --locked -- --ignored

      - name: Test packaged Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NETRAY_TEST_XRAY = (Resolve-Path "netray-windows/dist/netray-windows/xray.exe").Path
          cargo test --locked --manifest-path netray-windows/Cargo.toml -- --ignored

      - name: Upload Windows release package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: netray-windows
          path: netray-windows/dist/*.zip

      - name: Upload Linux release packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: netray-linux
          path: |
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: netray-*
          path: dist
          merge-multiple: true

      - name: Calculate release version
        shell: bash
        run: |
          OFFSET=29
          BUILD_NUM=$(( ${{ github.run_number }} - OFFSET ))
          if [ "$BUILD_NUM" -lt 4 ]; then
            BUILD_NUM=4
          fi
          echo "NETRAY_VERSION=1.0.${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION=1.0.${BUILD_NUM}" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --pretty=format:"* %s (%h)")
          fi

          cat << EOF > dist/RELEASE_NOTES.md
          ## Netray v$VERSION

          ### 🚀 Changes in this Build
          ${COMMITS:-* Automated CI build and release package}

          ### 📦 Built Packages
          - **Windows 64-bit Portable**: \`netray-windows-$VERSION.zip\` (bundled with Wintun driver & Xray-core)
          - **Linux RPM Package**: \`netray-$VERSION-1.x86_64.rpm\` (Fedora, RHEL, openSUSE)
          - **Linux 64-bit Portable**: \`netray-linux-linux-64-$VERSION.tar.gz\` (bundled with Xray-core)

          ### 🔒 Integrity & Security
          - Bundled with unmodified, official Xray-core v26.10.21.
          - Built on GitHub CI from commit \`${GITHUB_SHA}\`.
          EOF

      - name: Create or update versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.rpm dist/*.tar.gz --clobber
            gh release edit "$tag" -F dist/RELEASE_NOTES.md --title "Netray $tag"
          else
            gh release create "$tag" dist/*.zip dist/*.rpm dist/*.tar.gz --target "${GITHUB_SHA}" \
              --title "Netray $tag" \
              -F dist/RELEASE_NOTES.md
          fi
