<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 2160" width="2160" height="2160" shape-rendering="geometricPrecision">
  <defs>
    
    <!-- Background Plate Gradient -->
    <linearGradient id="mainBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="leftPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="rightPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Diagonal Ray Gradient -->
    <linearGradient id="diagonalBeamGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Refraction Tint Gradient -->
    <linearGradient id="refractGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#52525B" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Rim Gradient -->
    <linearGradient id="rimSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Title Silver Gradient -->
    <linearGradient id="textSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Modern Apple Squircle Clip -->
    <clipPath id="squircleBoundary">
      <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    " />
    </clipPath>


    <!-- Box Background Radial Gradient -->
    <radialGradient id="boxBgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="45%" stop-color="#0E0F14"/>
      <stop offset="85%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>

    <!-- Halo Behind Icon -->
    <radialGradient id="boxIconHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow under Icon -->
    <radialGradient id="iconShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="2160" height="2160" fill="url(#boxBgGrad)"/>

  <!-- Celestial Network Precision Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="2">
    <!-- Concentric radar circles -->
    <circle cx="1080" cy="900" r="540" fill="none" stroke-dasharray="8 12"/>
    <circle cx="1080" cy="900" r="760" fill="none" stroke-dasharray="6 14"/>
    <circle cx="1080" cy="900" r="980" fill="none" stroke-dasharray="4 16"/>

    <!-- Crosshair axes -->
    <line x1="1080" y1="60" x2="1080" y2="2100" stroke-dasharray="8 16"/>
    <line x1="60" y1="900" x2="2100" y2="900" stroke-dasharray="8 16"/>
    <line x1="200" y1="20" x2="1960" y2="1780" stroke-dasharray="4 20" opacity="0.5"/>
    <line x1="1960" y1="20" x2="200" y2="1780" stroke-dasharray="4 20" opacity="0.5"/>
  </g>

  <!-- Network Constellation Node Highlights -->
  <g opacity="0.3">
    <circle cx="480" cy="500" r="4" fill="#38BDF8"/>
    <circle cx="1680" cy="500" r="4" fill="#818CF8"/>
    <circle cx="320" cy="900" r="5" fill="#38BDF8"/>
    <circle cx="1840" cy="900" r="5" fill="#818CF8"/>
    <circle cx="540" cy="1300" r="4" fill="#38BDF8"/>
    <circle cx="1620" cy="1300" r="4" fill="#818CF8"/>
    <line x1="480" y1="500" x2="320" y2="900" stroke="#38BDF8" stroke-width="1.5" opacity="0.2"/>
    <line x1="320" y1="900" x2="540" y2="1300" stroke="#38BDF8" stroke-width="1.5" opacity="0.2"/>
    <line x1="1680" y1="500" x2="1840" y2="900" stroke="#818CF8" stroke-width="1.5" opacity="0.2"/>
    <line x1="1840" y1="900" x2="1620" y2="1300" stroke="#818CF8" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Ambient Light Halo behind Icon -->
  <circle cx="1080" cy="900" r="700" fill="url(#boxIconHalo)"/>

  <!-- Icon Soft Drop Shadow -->
  <ellipse cx="1080" cy="1370" rx="460" ry="80" fill="url(#iconShadow)"/>

  <!-- Hero Netray Icon (880x880) -->
  <g transform="translate(640, 460) scale(0.859375)">
    
  <!-- Squircle Base Layer -->
  <g clip-path="url(#squircleBoundary)">
    <!-- Base Chassis -->
    <rect width="1024" height="1024" fill="url(#mainBgGrad)"/>

    <!-- Micro Structural Precision Grid -->
    <g opacity="0.035" stroke="#FFFFFF" stroke-width="1.5">
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <circle cx="512" cy="512" r="384" fill="none" stroke-dasharray="4 8"/>
    </g>

    <!-- Dynamic Architectural Glyph Centerpiece -->
    <g id="prism-archetype">
      <!-- Background refraction facet -->
      <polygon points="308,716 463.04,479.36 560.96,544.64 716,308"
               fill="url(#refractGradient)"
               opacity="0.22" />

      <!-- Left Pillar Plane -->
      <polygon points="308,716 308,308 356,327.2 356,716"
               fill="url(#leftPlaneGrad)" />

      <!-- Right Pillar Plane -->
      <polygon points="668,716 668,336.8 716,308 716,716"
               fill="url(#rightPlaneGrad)" />

      <!-- Diagonal Refracting Beam -->
      <polygon points="308,308 360.8,308 716,716 663.2,716"
               fill="url(#diagonalBeamGrad)" />

      <!-- Razor-sharp Crisp Facet Seam -->
      <line x1="308" y1="308" x2="716" y2="716"
             stroke="#FFFFFF"
             stroke-width="2.4"
             stroke-linecap="round"
             opacity="0.85"/>

      <!-- Central Light Portal Vertex -->
      <circle cx="512" cy="512" r="10.56" fill="#FFFFFF" />
    </g>

    <!-- Inner Chamfer & Specular Perimeter Edge -->
    <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
          fill="none"
          stroke="url(#rimSheenGrad)"
          stroke-width="14"
          opacity="0.9" />
  </g>

  <!-- Crisp Outer Geometric Boundary Line -->
  <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="2.5" />

  </g>

  <!-- Brand Typography Section -->
  <!-- App Title: NETRAY -->
  <text x="1080" y="1530"
        font-family="system-ui, 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-size="122"
        font-weight="800"
        letter-spacing="22"
        text-anchor="middle"
        fill="url(#textSilverGrad)">NETRAY</text>

  <!-- Cyan/Violet Accent Separator -->
  <rect x="880" y="1575" width="400" height="3" rx="1.5" fill="url(#cyanAccentGrad)"/>

  <!-- Subtitle Tagline -->
  <text x="1080" y="1640"
        font-family="system-ui, 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-size="34"
        font-weight="600"
        letter-spacing="10"
        text-anchor="middle"
        fill="#94A3B8">NEXT-GEN NETWORK PROXY UTILITY</text>

  <!-- Feature Pills Row -->
  <g transform="translate(1080, 1740)">
    <!-- Pill 1: V2RAY & VLESS -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="280" height="52" rx="26" fill="#18181B" stroke="#27272A" stroke-width="2"/>
      <circle cx="34" cy="26" r="6" fill="#38BDF8"/>
      <text x="150" y="34"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="22"
            font-weight="700"
            letter-spacing="3"
            text-anchor="middle"
            fill="#E4E4E7">V2RAY / VLESS</text>
    </g>

    <!-- Pill 2: SYSTEM TUNNEL -->
    <g transform="translate(-140, 0)">
      <rect x="0" y="0" width="280" height="52" rx="26" fill="#18181B" stroke="#27272A" stroke-width="2"/>
      <circle cx="34" cy="26" r="6" fill="#A855F7"/>
      <text x="150" y="34"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="22"
            font-weight="700"
            letter-spacing="3"
            text-anchor="middle"
            fill="#E4E4E7">WINTUN ROUTE</text>
    </g>

    <!-- Pill 3: SECURE PROXY -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="280" height="52" rx="26" fill="#18181B" stroke="#27272A" stroke-width="2"/>
      <circle cx="34" cy="26" r="6" fill="#22C55E"/>
      <text x="150" y="34"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="22"
            font-weight="700"
            letter-spacing="3"
            text-anchor="middle"
            fill="#E4E4E7">SYSTEM PROXY</text>
    </g>
  </g>

  <!-- Footer Publisher & Platform -->
  <text x="1080" y="1940"
        font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="6"
        text-anchor="middle"
        fill="#52525B">VTECHDEV • WINDOWS 10 / 11</text>
</svg>