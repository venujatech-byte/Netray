<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 800" width="584" height="800" shape-rendering="geometricPrecision">
  <defs>
    
    <!-- Background Plate Gradient -->
    <linearGradient id="mainBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="leftPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="rightPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Diagonal Ray Gradient -->
    <linearGradient id="diagonalBeamGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Refraction Tint Gradient -->
    <linearGradient id="refractGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#52525B" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Rim Gradient -->
    <linearGradient id="rimSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Title Silver Gradient -->
    <linearGradient id="textSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Modern Apple Squircle Clip -->
    <clipPath id="squircleBoundary">
      <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    " />
    </clipPath>


    <!-- Radial Background Gradient -->
    <radialGradient id="brandedKeyBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#181922"/>
      <stop offset="45%" stop-color="#0E0F14"/>
      <stop offset="80%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>

    <!-- Halo Behind Icon -->
    <radialGradient id="keyHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow under Icon -->
    <radialGradient id="keyShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="584" height="800" fill="url(#brandedKeyBg)"/>

  <!-- Ambient Radar & Constellation Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="292" cy="210" r="160" fill="none" stroke-dasharray="6 8"/>
    <circle cx="292" cy="210" r="240" fill="none" stroke-dasharray="4 10"/>
    <circle cx="292" cy="210" r="320" fill="none" stroke-dasharray="3 12"/>
    <line x1="292" y1="20" x2="292" y2="600" stroke-dasharray="6 10"/>
    <line x1="20" y1="210" x2="564" y2="210" stroke-dasharray="6 10"/>
  </g>

  <!-- Nodes -->
  <g opacity="0.3">
    <circle cx="110" cy="120" r="3" fill="#38BDF8"/>
    <circle cx="474" cy="120" r="3" fill="#818CF8"/>
    <circle cx="60" cy="210" r="4" fill="#38BDF8"/>
    <circle cx="524" cy="210" r="4" fill="#818CF8"/>
    <circle cx="100" cy="300" r="3" fill="#38BDF8"/>
    <circle cx="484" cy="300" r="3" fill="#818CF8"/>
    <line x1="110" y1="120" x2="60" y2="210" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="210" x2="100" y2="300" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
    <line x1="474" y1="120" x2="524" y2="210" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
    <line x1="524" y1="210" x2="484" y2="300" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Light Halo Behind Icon -->
  <circle cx="292" cy="210" r="220" fill="url(#keyHalo)"/>

  <!-- Icon Drop Shadow -->
  <ellipse cx="292" cy="350" rx="140" ry="26" fill="url(#keyShadow)"/>

  <!-- Hero Netray Icon (260x260) -->
  <g transform="translate(162, 80) scale(0.25390625)">
    
  <!-- Squircle Base Layer -->
  <g clip-path="url(#squircleBoundary)">
    <!-- Base Chassis -->
    <rect width="1024" height="1024" fill="url(#mainBgGrad)"/>

    <!-- Micro Structural Precision Grid -->
    <g opacity="0.035" stroke="#FFFFFF" stroke-width="1.5">
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <circle cx="512" cy="512" r="384" fill="none" stroke-dasharray="4 8"/>
    </g>

    <!-- Dynamic Architectural Glyph Centerpiece -->
    <g id="prism-archetype">
      <!-- Background refraction facet -->
      <polygon points="308,716 463.04,479.36 560.96,544.64 716,308"
               fill="url(#refractGradient)"
               opacity="0.22" />

      <!-- Left Pillar Plane -->
      <polygon points="308,716 308,308 356,327.2 356,716"
               fill="url(#leftPlaneGrad)" />

      <!-- Right Pillar Plane -->
      <polygon points="668,716 668,336.8 716,308 716,716"
               fill="url(#rightPlaneGrad)" />

      <!-- Diagonal Refracting Beam -->
      <polygon points="308,308 360.8,308 716,716 663.2,716"
               fill="url(#diagonalBeamGrad)" />

      <!-- Razor-sharp Crisp Facet Seam -->
      <line x1="308" y1="308" x2="716" y2="716"
             stroke="#FFFFFF"
             stroke-width="2.4"
             stroke-linecap="round"
             opacity="0.85"/>

      <!-- Central Light Portal Vertex -->
      <circle cx="512" cy="512" r="10.56" fill="#FFFFFF" />
    </g>

    <!-- Inner Chamfer & Specular Perimeter Edge -->
    <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
          fill="none"
          stroke="url(#rimSheenGrad)"
          stroke-width="14"
          opacity="0.9" />
  </g>

  <!-- Crisp Outer Geometric Boundary Line -->
  <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="2.5" />

  </g>

  <!-- ============================================== -->
  <!-- TITLE & BRANDING (ALL WITHIN TOP 3/4: Y <= 600) -->
  <!-- ============================================== -->

  <!-- Brand Title: NETRAY -->
  <text x="292" y="420"
        font-family="system-ui, 'Segoe UI', -apple-system, Roboto, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="12"
        text-anchor="middle"
        fill="url(#textSilverGrad)">NETRAY</text>

  <!-- Cyan Accent Line -->
  <rect x="182" y="440" width="220" height="2" rx="1" fill="url(#cyanAccentGrad)"/>

  <!-- Subtitle Tagline -->
  <text x="292" y="475"
        font-family="system-ui, 'Segoe UI', -apple-system, Roboto, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="4"
        text-anchor="middle"
        fill="#94A3B8">SECURE NETWORK &amp; PROXY</text>

  <!-- Feature Chips (Ends at Y = 560, strictly < 600) -->
  <g transform="translate(292, 515)">
    <g transform="translate(-155, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4" fill="#38BDF8"/>
      <text x="80" y="23"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="13"
            font-weight="700"
            letter-spacing="1.5"
            text-anchor="middle"
            fill="#E4E4E7">V2RAY CORE</text>
    </g>
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4" fill="#22C55E"/>
      <text x="80" y="23"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="13"
            font-weight="700"
            letter-spacing="1.5"
            text-anchor="middle"
            fill="#E4E4E7">SYS PROXY</text>
    </g>
  </g>

  <text x="292" y="580"
        font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="3"
        text-anchor="middle"
        fill="#52525B">VTECHDEV</text>

  <!-- Bottom 1/4 (Y=600 to 800) is clean dark fade for store UI badges -->
</svg>