<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2160" width="1440" height="2160" shape-rendering="geometricPrecision">
  <defs>
    
    <!-- Background Plate Gradient -->
    <linearGradient id="mainBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="leftPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="rightPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Diagonal Ray Gradient -->
    <linearGradient id="diagonalBeamGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Refraction Tint Gradient -->
    <linearGradient id="refractGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#52525B" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Rim Gradient -->
    <linearGradient id="rimSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Title Silver Gradient -->
    <linearGradient id="textSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Modern Apple Squircle Clip -->
    <clipPath id="squircleBoundary">
      <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    " />
    </clipPath>


    <!-- Vertical Poster Radial Gradient -->
    <radialGradient id="posterBgGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#181922"/>
      <stop offset="42%" stop-color="#0E0F14"/>
      <stop offset="80%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>

    <!-- Halo Behind Icon -->
    <radialGradient id="posterIconHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow under Icon -->
    <radialGradient id="posterShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="1440" height="2160" fill="url(#posterBgGrad)"/>

  <!-- Celestial Network Precision Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="2">
    <circle cx="720" cy="800" r="480" fill="none" stroke-dasharray="8 12"/>
    <circle cx="720" cy="800" r="700" fill="none" stroke-dasharray="6 14"/>
    <circle cx="720" cy="800" r="920" fill="none" stroke-dasharray="4 16"/>

    <line x1="720" y1="40" x2="720" y2="2120" stroke-dasharray="8 16"/>
    <line x1="40" y1="800" x2="1400" y2="800" stroke-dasharray="8 16"/>
    <line x1="100" y1="180" x2="1340" y2="1420" stroke-dasharray="4 20" opacity="0.4"/>
    <line x1="1340" y1="180" x2="100" y2="1420" stroke-dasharray="4 20" opacity="0.4"/>
  </g>

  <!-- Constellation Nodes & Beam lines -->
  <g opacity="0.32">
    <circle cx="280" cy="460" r="4" fill="#38BDF8"/>
    <circle cx="1160" cy="460" r="4" fill="#818CF8"/>
    <circle cx="180" cy="800" r="5" fill="#38BDF8"/>
    <circle cx="1260" cy="800" r="5" fill="#818CF8"/>
    <circle cx="320" cy="1180" r="4" fill="#38BDF8"/>
    <circle cx="1120" cy="1180" r="4" fill="#818CF8"/>
    <line x1="280" y1="460" x2="180" y2="800" stroke="#38BDF8" stroke-width="1.5" opacity="0.25"/>
    <line x1="180" y1="800" x2="320" y2="1180" stroke="#38BDF8" stroke-width="1.5" opacity="0.25"/>
    <line x1="1160" y1="460" x2="1260" y2="800" stroke="#818CF8" stroke-width="1.5" opacity="0.25"/>
    <line x1="1260" y1="800" x2="1120" y2="1180" stroke="#818CF8" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Header Branding -->
  <g transform="translate(720, 210)">
    <text x="0" y="0"
          font-family="system-ui, 'Segoe UI', -apple-system, Roboto, sans-serif"
          font-size="24"
          font-weight="700"
          letter-spacing="10"
          text-anchor="middle"
          fill="#71717A">VTECHDEV PRESENTS</text>
    <rect x="-60" y="24" width="120" height="2" rx="1" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- Ambient Light Halo behind Icon -->
  <circle cx="720" cy="800" r="620" fill="url(#posterIconHalo)"/>

  <!-- Icon Soft Drop Shadow -->
  <ellipse cx="720" cy="1230" rx="420" ry="70" fill="url(#posterShadow)"/>

  <!-- Hero Netray Icon (800x800) -->
  <g transform="translate(320, 400) scale(0.78125)">
    
  <!-- Squircle Base Layer -->
  <g clip-path="url(#squircleBoundary)">
    <!-- Base Chassis -->
    <rect width="1024" height="1024" fill="url(#mainBgGrad)"/>

    <!-- Micro Structural Precision Grid -->
    <g opacity="0.035" stroke="#FFFFFF" stroke-width="1.5">
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <circle cx="512" cy="512" r="384" fill="none" stroke-dasharray="4 8"/>
    </g>

    <!-- Dynamic Architectural Glyph Centerpiece -->
    <g id="prism-archetype">
      <!-- Background refraction facet -->
      <polygon points="308,716 463.04,479.36 560.96,544.64 716,308"
               fill="url(#refractGradient)"
               opacity="0.22" />

      <!-- Left Pillar Plane -->
      <polygon points="308,716 308,308 356,327.2 356,716"
               fill="url(#leftPlaneGrad)" />

      <!-- Right Pillar Plane -->
      <polygon points="668,716 668,336.8 716,308 716,716"
               fill="url(#rightPlaneGrad)" />

      <!-- Diagonal Refracting Beam -->
      <polygon points="308,308 360.8,308 716,716 663.2,716"
               fill="url(#diagonalBeamGrad)" />

      <!-- Razor-sharp Crisp Facet Seam -->
      <line x1="308" y1="308" x2="716" y2="716"
             stroke="#FFFFFF"
             stroke-width="2.4"
             stroke-linecap="round"
             opacity="0.85"/>

      <!-- Central Light Portal Vertex -->
      <circle cx="512" cy="512" r="10.56" fill="#FFFFFF" />
    </g>

    <!-- Inner Chamfer & Specular Perimeter Edge -->
    <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
          fill="none"
          stroke="url(#rimSheenGrad)"
          stroke-width="14"
          opacity="0.9" />
  </g>

  <!-- Crisp Outer Geometric Boundary Line -->
  <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="2.5" />

  </g>

  <!-- Brand Typography Section -->
  <text x="720" y="1380"
        font-family="system-ui, 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-size="124"
        font-weight="800"
        letter-spacing="24"
        text-anchor="middle"
        fill="url(#textSilverGrad)">NETRAY</text>

  <!-- Cyan/Violet Accent Separator -->
  <rect x="520" y="1425" width="400" height="3" rx="1.5" fill="url(#cyanAccentGrad)"/>

  <!-- Subtitle Tagline -->
  <text x="720" y="1490"
        font-family="system-ui, 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, 'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-size="30"
        font-weight="600"
        letter-spacing="8"
        text-anchor="middle"
        fill="#94A3B8">ADVANCED NETWORK &amp; PROXY ORCHESTRATOR</text>

  <!-- Feature Highlights Box / Card Grid -->
  <g transform="translate(720, 1580)">
    <!-- Feature Card 1 -->
    <g transform="translate(-520, 0)">
      <rect x="0" y="0" width="500" height="84" rx="20" fill="#141418" stroke="#27272A" stroke-width="2"/>
      <circle cx="44" cy="42" r="10" fill="#38BDF8"/>
      <text x="74" y="38"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="24"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">HIGH-SPEED TUNNELING</text>
      <text x="74" y="64"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="500"
            letter-spacing="1"
            fill="#71717A">WinTun TAP / Transparent Route</text>
    </g>

    <!-- Feature Card 2 -->
    <g transform="translate(20, 0)">
      <rect x="0" y="0" width="500" height="84" rx="20" fill="#141418" stroke="#27272A" stroke-width="2"/>
      <circle cx="44" cy="42" r="10" fill="#A855F7"/>
      <text x="74" y="38"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="24"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">V2RAY &amp; VLESS CORE</text>
      <text x="74" y="64"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="500"
            letter-spacing="1"
            fill="#71717A">Next-generation secure protocols</text>
    </g>

    <!-- Feature Card 3 -->
    <g transform="translate(-520, 104)">
      <rect x="0" y="0" width="500" height="84" rx="20" fill="#141418" stroke="#27272A" stroke-width="2"/>
      <circle cx="44" cy="42" r="10" fill="#22C55E"/>
      <text x="74" y="38"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="24"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">SYSTEM-WIDE PROXY</text>
      <text x="74" y="64"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="500"
            letter-spacing="1"
            fill="#71717A">Seamless Windows proxy switching</text>
    </g>

    <!-- Feature Card 4 -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="500" height="84" rx="20" fill="#141418" stroke="#27272A" stroke-width="2"/>
      <circle cx="44" cy="42" r="10" fill="#F59E0B"/>
      <text x="74" y="38"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="24"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">ZERO-LOG PRIVACY</text>
      <text x="74" y="64"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="500"
            letter-spacing="1"
            fill="#71717A">100% Client-side local control</text>
    </g>
  </g>

  <!-- Footer Platform Badge -->
  <g transform="translate(720, 1960)">
    <text x="0" y="0"
          font-family="system-ui, 'Segoe UI', sans-serif"
          font-size="22"
          font-weight="700"
          letter-spacing="6"
          text-anchor="middle"
          fill="#52525B">NATIVE 64-BIT APPLICATION FOR WINDOWS 10 &amp; 11</text>
    <text x="0" y="36"
          font-family="system-ui, 'Segoe UI', sans-serif"
          font-size="18"
          font-weight="600"
          letter-spacing="4"
          text-anchor="middle"
          fill="#3F3F46">OFFICIAL MICROSOFT STORE DISTRIBUTION</text>
  </g>
</svg>