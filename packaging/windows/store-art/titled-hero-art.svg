<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" shape-rendering="geometricPrecision">
  <defs>
    
    <!-- Background Plate Gradient -->
    <linearGradient id="mainBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="leftPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="rightPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Diagonal Ray Gradient -->
    <linearGradient id="diagonalBeamGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Refraction Tint Gradient -->
    <linearGradient id="refractGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#52525B" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Rim Gradient -->
    <linearGradient id="rimSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Title Silver Gradient -->
    <linearGradient id="textSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Modern Apple Squircle Clip -->
    <clipPath id="squircleBoundary">
      <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    " />
    </clipPath>


    <!-- Titled Hero Radial Gradient -->
    <radialGradient id="titledHeroBg" cx="45%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#181922"/>
      <stop offset="45%" stop-color="#0E0F14"/>
      <stop offset="80%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>

    <!-- Halo Behind Icon -->
    <radialGradient id="titledHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow under Icon -->
    <radialGradient id="titledShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="1920" height="1080" fill="url(#titledHeroBg)"/>

  <!-- Celestial Network Precision Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="2">
    <circle cx="480" cy="420" r="320" fill="none" stroke-dasharray="8 12"/>
    <circle cx="480" cy="420" r="500" fill="none" stroke-dasharray="6 14"/>
    <circle cx="480" cy="420" r="680" fill="none" stroke-dasharray="4 16"/>

    <line x1="480" y1="40" x2="480" y2="800" stroke-dasharray="8 16"/>
    <line x1="40" y1="420" x2="1880" y2="420" stroke-dasharray="8 16"/>
  </g>

  <!-- Constellation Nodes & Beam lines -->
  <g opacity="0.3">
    <circle cx="160" cy="220" r="4" fill="#38BDF8"/>
    <circle cx="820" cy="220" r="4" fill="#818CF8"/>
    <circle cx="100" cy="420" r="5" fill="#38BDF8"/>
    <circle cx="860" cy="420" r="5" fill="#818CF8"/>
    <circle cx="180" cy="620" r="4" fill="#38BDF8"/>
    <circle cx="800" cy="620" r="4" fill="#818CF8"/>
    <line x1="160" y1="220" x2="100" y2="420" stroke="#38BDF8" stroke-width="1.5" opacity="0.25"/>
    <line x1="100" y1="420" x2="180" y2="620" stroke="#38BDF8" stroke-width="1.5" opacity="0.25"/>
    <line x1="820" y1="220" x2="860" y2="420" stroke="#818CF8" stroke-width="1.5" opacity="0.25"/>
    <line x1="860" y1="420" x2="800" y2="620" stroke="#818CF8" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Halo Behind Icon -->
  <circle cx="480" cy="420" r="420" fill="url(#titledHalo)"/>

  <!-- Icon Drop Shadow -->
  <ellipse cx="480" cy="690" rx="270" ry="50" fill="url(#titledShadow)"/>

  <!-- Hero Netray Icon (520x520) -->
  <g transform="translate(220, 160) scale(0.5078125)">
    
  <!-- Squircle Base Layer -->
  <g clip-path="url(#squircleBoundary)">
    <!-- Base Chassis -->
    <rect width="1024" height="1024" fill="url(#mainBgGrad)"/>

    <!-- Micro Structural Precision Grid -->
    <g opacity="0.035" stroke="#FFFFFF" stroke-width="1.5">
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <circle cx="512" cy="512" r="384" fill="none" stroke-dasharray="4 8"/>
    </g>

    <!-- Dynamic Architectural Glyph Centerpiece -->
    <g id="prism-archetype">
      <!-- Background refraction facet -->
      <polygon points="308,716 463.04,479.36 560.96,544.64 716,308"
               fill="url(#refractGradient)"
               opacity="0.22" />

      <!-- Left Pillar Plane -->
      <polygon points="308,716 308,308 356,327.2 356,716"
               fill="url(#leftPlaneGrad)" />

      <!-- Right Pillar Plane -->
      <polygon points="668,716 668,336.8 716,308 716,716"
               fill="url(#rightPlaneGrad)" />

      <!-- Diagonal Refracting Beam -->
      <polygon points="308,308 360.8,308 716,716 663.2,716"
               fill="url(#diagonalBeamGrad)" />

      <!-- Razor-sharp Crisp Facet Seam -->
      <line x1="308" y1="308" x2="716" y2="716"
             stroke="#FFFFFF"
             stroke-width="2.4"
             stroke-linecap="round"
             opacity="0.85"/>

      <!-- Central Light Portal Vertex -->
      <circle cx="512" cy="512" r="10.56" fill="#FFFFFF" />
    </g>

    <!-- Inner Chamfer & Specular Perimeter Edge -->
    <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
          fill="none"
          stroke="url(#rimSheenGrad)"
          stroke-width="14"
          opacity="0.9" />
  </g>

  <!-- Crisp Outer Geometric Boundary Line -->
  <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="2.5" />

  </g>

  <!-- ============================================== -->
  <!-- TITLE & BRANDING (ALL WITHIN TOP 3/4: Y <= 810) -->
  <!-- ============================================== -->

  <!-- Brand Title: NETRAY -->
  <text x="1000" y="320"
        font-family="system-ui, 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, sans-serif"
        font-size="108"
        font-weight="800"
        letter-spacing="20"
        fill="url(#textSilverGrad)">NETRAY</text>

  <!-- Cyan/Violet Accent Separator -->
  <rect x="1000" y="355" width="480" height="3" rx="1.5" fill="url(#cyanAccentGrad)"/>

  <!-- Subtitle Tagline -->
  <text x="1000" y="415"
        font-family="system-ui, 'Segoe UI', -apple-system, 'SF Pro Display', Roboto, sans-serif"
        font-size="24"
        font-weight="600"
        letter-spacing="6"
        fill="#94A3B8">ADVANCED NETWORK &amp; PROXY ORCHESTRATOR</text>

  <!-- Feature Highlights Rows -->
  <g transform="translate(1000, 480)">
    <!-- Feature Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="56" rx="28" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <circle cx="36" cy="28" r="7" fill="#38BDF8"/>
      <text x="56" y="35"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">HIGH-SPEED TUNNELING</text>
    </g>

    <!-- Feature Pill 2 -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="340" height="56" rx="28" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <circle cx="36" cy="28" r="7" fill="#A855F7"/>
      <text x="56" y="35"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">V2RAY &amp; VLESS CORE</text>
    </g>

    <!-- Feature Pill 3 -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="340" height="56" rx="28" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <circle cx="36" cy="28" r="7" fill="#22C55E"/>
      <text x="56" y="35"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">SYSTEM-WIDE PROXY</text>
    </g>

    <!-- Feature Pill 4 -->
    <g transform="translate(360, 76)">
      <rect x="0" y="0" width="340" height="56" rx="28" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <circle cx="36" cy="28" r="7" fill="#F59E0B"/>
      <text x="56" y="35"
            font-family="system-ui, 'Segoe UI', sans-serif"
            font-size="18"
            font-weight="700"
            letter-spacing="2"
            fill="#FFFFFF">ZERO-LOG PRIVACY</text>
    </g>
  </g>

  <!-- Publisher Credit (Ends at Y = 750, strictly < 810) -->
  <text x="1000" y="730"
        font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="4"
        fill="#52525B">VTECHDEV • WINDOWS &amp; XBOX</text>

  <!-- Bottom 1/4 (Y=810 to 1080) is reserved clean space for store UI elements -->
</svg>