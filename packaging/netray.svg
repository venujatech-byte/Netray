<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Background Plate Gradient -->
    <linearGradient id="mainBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="leftPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="rightPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Diagonal Ray Gradient -->
    <linearGradient id="diagonalBeamGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Refraction Tint Gradient -->
    <linearGradient id="refractGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#52525B" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Rim Gradient -->
    <linearGradient id="rimSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E4E4E7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Modern Apple Squircle Clip -->
    <clipPath id="squircleBoundary">
      <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    " />
    </clipPath>
  </defs>

  <!-- Squircle Base Layer -->
  <g clip-path="url(#squircleBoundary)">
    <!-- Base Chassis -->
    <rect width="1024" height="1024" fill="url(#mainBgGrad)"/>


    <!-- Micro Structural Precision Grid -->
    <g opacity="0.035" stroke="#FFFFFF" stroke-width="1.5">
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <circle cx="512" cy="512" r="384" fill="none" stroke-dasharray="4 8"/>
    </g>


    <!-- Dynamic Architectural Glyph Centerpiece -->

            <!-- Variant 1: Prism Refraction 'N' -->
            <g id="prism-archetype">
              <!-- Background refraction facet -->
              <polygon points="308,716 463.04,479.36 560.96,544.64 716,308"
                       fill="url(#refractGradient)"
                       opacity="0.22" />

              <!-- Left Pillar Plane -->
              <polygon points="308,716 308,308 356,327.2 356,716"
                       fill="url(#leftPlaneGrad)" />

              <!-- Right Pillar Plane -->
              <polygon points="668,716 668,336.8 716,308 716,716"
                       fill="url(#rightPlaneGrad)" />

              <!-- Diagonal Refracting Beam -->
              <polygon points="308,308 360.8,308 716,716 663.2,716"
                       fill="url(#diagonalBeamGrad)" />

              <!-- Razor-sharp Crisp Facet Seam -->
              <line x1="308" y1="308" x2="716" y2="716"
                    stroke="#FFFFFF"
                    stroke-width="2.4000000000000004"
                    stroke-linecap="round"
                    opacity="0.85"/>

              <!-- Central Light Portal Vertex -->
              <circle cx="512" cy="512" r="10.56" fill="#FFFFFF" />
            </g>



    <!-- Inner Chamfer & Specular Perimeter Edge -->
    <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
          fill="none"
          stroke="url(#rimSheenGrad)"
          stroke-width="14"
          opacity="0.9" />

  </g>

  <!-- Crisp Outer Geometric Boundary Line -->
  <path d="
      M 1024, 512
      C 1024, 794.67 794.67, 1024 512, 1024
      C 229.33, 1024 0, 794.67 0, 512
      C 0, 229.33 229.33, 0 512, 0
      C 794.67, 0 1024, 229.33 1024, 512 Z
    "
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="2.5" />
</svg>
